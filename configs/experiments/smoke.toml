# Small experiment for validating the tournament pipeline locally.
#
#   python scripts/run_tournament.py --config configs/experiments/smoke.toml
#   python scripts/run_full_experiment.py --config configs/experiments/smoke.toml

seed = 0
output_dir = "results/smoke"
games_per_pair = 2
blunder_threshold = 0.3
blunder_sample_every = 1

[[players]]
id = "random-a"
type = "random"

[[players]]
id = "random-b"
type = "random"

[[players]]
id = "minimax-d2"
type = "minimax"
depth = 2

[[players]]
id = "uct"
type = "uct"
iterations = 50

[[players]]
id = "oracle"
type = "uct"
tags = ["ORACLE"]
iterations = 100
