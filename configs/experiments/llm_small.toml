# Small LLM comparison experiment.
#
#   python scripts/run_tournament.py --config configs/experiments/llm_small.toml

seed = 0
output_dir = "results/llm_small"
games_per_pair = 1
blunder_threshold = 0.3

[[players]]
id = "random"
type = "random"

[[players]]
id = "minimax-d3"
type = "minimax"
depth = 3

[[players]]
id = "uct"
type = "uct"
iterations = 100

[[players]]
id = "llm-local"
type = "llm"
model = "llama3"
base_url = "http://localhost:11434/v1"
temperature = 0.7
