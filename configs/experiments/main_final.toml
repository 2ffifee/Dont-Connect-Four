# Final compact tournament after choosing representative variants.
#
# Run:
#   python scripts/run_full_experiment.py --config configs/experiments/main_final.toml
#   python scripts/run_tournament.py --config configs/experiments/main_final.toml

seed = 0
output_dir = "results/main_final"
games_per_pair = 10
blunder_threshold = 0.3
blunder_sample_every = 1

