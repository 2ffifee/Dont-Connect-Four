# Tiny oracle used only to validate the end-to-end experiment pipeline.
#
# This is NOT a reliable reference engine for final Blunder Rate numbers. It is
# intentionally small enough to run on a weak laptop in a few minutes, while
# still exercising the same code paths as the full oracle.
#
# Usage:
#   python scripts/train_oracle.py --config configs/experiments/oracle_smoke.toml
#   python scripts/score_blunders.py --oracle models/experiments/oracle_smoke.pkl --input-dir results/smoke --max-positions 100

[oracle]
algorithm      = "uct"
exploration    = 1.0
power_mean_p   = 1.0
fpu            = "none"
rollout_policy = "random"
final_move     = "robust"
max_rollout_moves = 80
seed           = 0

[training]
selfplay_iterations    = 100
selfplay_temperature   = 1.0
max_selfplay_games     = 5
max_minutes            = 5
checkpoint_every_games = 1
output                 = "models/experiments/oracle_smoke.pkl"

[memory]
limit_gb                = 0.05
bytes_per_node_estimate = 2867
safety_fraction         = 0.85

[evaluation]
iterations_per_position = 200
blunder_threshold       = 0.3
