# Legacy tournament grid config — superseded by configs/experiments/main_final.toml.
#
# Player definitions now live in a single experiment config with:
#   seed, output_dir, games_per_pair
#   [[players]] with type = random|minimax|uct|fpu|pmbp|lgr|llm + hyperparameters
#
# See configs/experiments/main_final.toml for the current tournament setup.

seed = 0
output_dir = "results/main_final"
games_per_pair = 10

[[players]]
id = "random"
type = "random"

[[players]]
id = "minimax-d4"
type = "minimax"
depth = 4

[[players]]
id = "uct"
type = "uct"
iterations = 1000

[[players]]
id = "oracle"
type = "uct"
tags = ["ORACLE"]
iterations = 20000
exploration = 1.0
