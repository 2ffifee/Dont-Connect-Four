# Tournament player grid (35 automated agents, round-robin).
#
# Training is bounded by in-RAM tree size, not game count:
#   - oracle: 16 GB  (scripts/train_oracle.py or --include-oracle here)
#   - others: <= 7 GB each  => oracle + one opponent fits in 32 GB RAM
#
# Train all MCTS entries:
#   python scripts/train_tournament_grid.py
#   python scripts/train_tournament_grid.py --only fpu-1.0-m7,lgr-m7
#
# Round-robin (10 games/pair, seed varies per game):
#   python scripts/run_tournament.py --games-per-pair 10 --base-seed 0
#
# LLM contestants (optional, configs/tournament_llm.toml):
#   python scripts/run_tournament.py --llm-config configs/tournament_llm.toml

[defaults]
play_iterations = 1000
build_iterations = 1000
selfplay_temperature = 1.0
exploration = 1.4142135623730951
power_mean_p = 1.0
final_move = "robust"
rollout_policy = "random"
seed = 0
bytes_per_node = 2867.0
safety_fraction = 0.85
max_selfplay_games = 100000
max_minutes = 480.0
checkpoint_every_games = 25
output_dir = "models/tournament"

# --- Baselines (no pickle; created at runtime) ---

[[players]]
id = "random"
kind = "builtin"
builtin = "random"

[[players]]
id = "minimax-d3"
kind = "builtin"
builtin = "minimax"
depth = 3

[[players]]
id = "minimax-d4"
kind = "builtin"
builtin = "minimax"
depth = 4

[[players]]
id = "minimax-d6"
kind = "builtin"
builtin = "minimax"
depth = 6

# --- Oracle (16 GB cap; also a tournament contestant) ---

[[players]]
id = "oracle"
kind = "mcts"
algorithm = "uct"
memory_gb = 16.0
exploration = 1.0
power_mean_p = 1.0
play_iterations = 1000

