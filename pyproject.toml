[project]
name = "connect4-mcts"
version = "0.1.0"
description = "MCTS/UCT agents for a modified Connect4 game."
requires-python = ">=3.11"
dependencies = [
    "pygame>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
